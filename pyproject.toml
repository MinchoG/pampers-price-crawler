[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pampers-price-crawler"
version = "0.1.0"
description = "Compare Bulgarian Pampers offers by price per diaper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "playwright>=1.49,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
price-check = "pampers_prices.compare:main"
pampers-prices = "pampers_prices.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pampers_prices"]

[tool.pytest.ini_options]
testpaths = ["tests"]

